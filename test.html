<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue 3 Bar Chart Plugin - Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      background: #f5f5f5;
    }
    
    h1 {
      color: #2c3e50;
      margin-bottom: 2rem;
    }
    
    .chart-section {
      background: white;
      padding: 2rem;
      margin-bottom: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    h2 {
      color: #34495e;
      margin-top: 0;
      margin-bottom: 1rem;
    }
    
    .gf-tooltip {
      padding: 8px 12px;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      font-size: 14px;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>Vue 3 Bar Chart Plugin - Quick Test</h1>
    
    <div class="chart-section">
      <h2>Example 1: Monthly Sales (Simple)</h2>
      <gf-barchart 
        :data="salesData"
        :width="600"
        :height="400"
        color="#3498db"
        background="#f8f9fa"
        :margin="{ top: 20, right: 30, bottom: 60, left: 70 }">
      </gf-barchart>
    </div>

    <div class="chart-section">
      <h2>Example 2: Age Group Demographics (Grouped Bars)</h2>
      <gf-barchart 
        :data="demographicsData"
        :width="800"
        :height="400"
        :colors="['#3498db', '#f39c12', '#95a5a6']"
        background="#f8f9fa"
        :margin="{ top: 20, right: 30, bottom: 60, left: 70 }"
        :bar-padding="0.3"
        :group-padding="0.05"
        :series="['Male', 'Female', 'Other']"
        :tooltip-fn="groupedTooltip">
      </gf-barchart>
    </div>

    <div class="chart-section">
      <h2>Example 3: Quarterly Revenue (Custom Colors & Tooltip)</h2>
      <gf-barchart 
        :data="revenueData"
        :width="600"
        :height="400"
        color="#e74c3c"
        background="#ecf0f1"
        :margin="{ top: 20, right: 30, bottom: 60, left: 70 }"
        :bar-padding="0.2"
        :tooltip-fn="customTooltip">
      </gf-barchart>
    </div>

    <div class="chart-section">
      <h2>Example 4: Product Sales Comparison (3 Products)</h2>
      <gf-barchart 
        :data="productSalesData"
        :width="700"
        :height="400"
        :colors="['#e74c3c', '#3498db', '#2ecc71']"
        background="#ffffff"
        :margin="{ top: 20, right: 30, bottom: 60, left: 70 }"
        :series="['Product A', 'Product B', 'Product C']"
        :tooltip-fn="productTooltip">
      </gf-barchart>
    </div>
  </div>

  <!-- Vue 3 from CDN -->
  <script type="importmap">
    {
      "imports": {
        "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
      }
    }
  </script>

  <!-- Your plugin (built) -->
  <script type="module">
    import { createApp } from 'vue'
    import BarchartPlugin from './dist/BarchartPlugin.js'

    const app = createApp({
      data() {
        return {
          salesData: [
            { key: 'Jan', value: 4500 },
            { key: 'Feb', value: 5200 },
            { key: 'Mar', value: 4800 },
            { key: 'Apr', value: 6100 },
            { key: 'May', value: 7200 },
            { key: 'Jun', value: 6800 }
          ],
          revenueData: [
            { key: 'Q1', value: 15000 },
            { key: 'Q2', value: 22000 },
            { key: 'Q3', value: 18000 },
            { key: 'Q4', value: 25000 }
          ],
          demographicsData: [
            { key: '0-10', values: [750, 600, 0] },
            { key: '11-20', values: [1950, 1750, 550] },
            { key: '21-30', values: [2900, 1250, 150] },
            { key: '31-40', values: [3400, 1750, 350] },
            { key: '41-50', values: [1350, 1350, 100] },
            { key: '51-60', values: [2350, 1450, 75] },
            { key: '61-70', values: [2500, 2300, 950] },
            { key: '71-80', values: [4000, 2900, 200] },
            { key: '81-90', values: [1350, 1350, 250] },
            { key: '91-100', values: [2350, 2350, 200] },
          ],
          productSalesData: [
            { key: 'Jan', values: [3200, 2800, 1900] },
            { key: 'Feb', values: [3800, 3200, 2100] },
            { key: 'Mar', values: [2900, 3500, 2400] },
            { key: 'Apr', values: [4200, 2900, 2800] },
            { key: 'May', values: [3600, 3800, 2200] },
            { key: 'Jun', values: [4100, 3300, 2600] }
          ]
        }
      },
      methods: {
        customTooltip(d) {
          return `<strong>${d.key}</strong><br/>Revenue: $${d.value.toLocaleString()}`
        },
        groupedTooltip(d) {
          return `<strong>${d.key} years</strong><br/>${d.seriesName}: ${d.value.toLocaleString()}`
        },
        productTooltip(d) {
          return `<strong>${d.key}</strong><br/>${d.seriesName}: ${d.value.toLocaleString()} units`
        }
      }
    })

    app.use(BarchartPlugin)
    app.mount('#app')
  </script>
</body>
</html>
